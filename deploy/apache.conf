# Managed by Fretboard Studio deploy.sh
<VirtualHost *:80>
    ServerName annotations.example.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    LimitRequestBody 22020096

    # Let Certbot's Apache plugin serve certificate challenges locally.
    ProxyPass "/.well-known/acme-challenge/" "!"
    ProxyPass "/" "http://127.0.0.1:3001/"
    ProxyPassReverse "/" "http://127.0.0.1:3001/"
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    ErrorLog ${APACHE_LOG_DIR}/guitar-annotations-error.log
    CustomLog ${APACHE_LOG_DIR}/guitar-annotations-access.log combined
</VirtualHost>
